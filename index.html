<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Secretary — V2</title>
<style>
:root{--bg:#09090b;--panel:#111114;--panel2:#16161a;--line:#24242a;--muted:#77777f;--text:#f2f2f4;--soft:#aaaab1;--white:#ededee}
*{box-sizing:border-box}html,body{margin:0;background:#050506;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}button,input{font:inherit}
.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);position:relative;padding-bottom:84px}
header{height:92px;padding:43px 20px 0;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:12px;letter-spacing:2.4px;font-weight:700}.tag{color:var(--muted);font-size:11px;margin-top:4px}.avatar{height:34px;width:34px;border:1px solid #35353b;border-radius:50%;display:grid;place-items:center;color:#bbb;font-size:12px}
main{padding:0 20px}.hero{padding:34px 0 26px}.ey{font-size:9px;letter-spacing:1.8px;color:#72727a;font-weight:700}.hero h1{font-size:35px;line-height:39px;letter-spacing:-1.1px;margin:9px 0 12px;font-weight:600}.desc{font-size:14px;line-height:21px;color:#96969e}
.quick{display:flex;gap:8px;overflow:auto;padding:0 0 22px}.chip{white-space:nowrap;background:#131316;border:1px solid #28282d;color:#bdbdc4;border-radius:20px;padding:10px 13px;font-size:12px}
.chat{display:flex;flex-direction:column;gap:9px;padding-bottom:110px}.msg{max-width:89%;padding:14px 15px;border-radius:17px;font-size:14px;line-height:20px}.ai{background:var(--panel2);border:1px solid var(--line)}.me{background:var(--white);color:#111;align-self:flex-end}
.ai small{display:block;color:#66666e;font-size:8px;letter-spacing:1.3px;margin-bottom:6px;font-weight:700}
.composer{position:fixed;z-index:5;bottom:69px;left:50%;transform:translateX(-50%);width:min(492px,calc(100% - 28px));background:#141418;border:1px solid #2b2b31;height:59px;border-radius:31px;padding:6px;display:flex;align-items:center;box-shadow:0 10px 30px #0008}.composer input{flex:1;background:none;border:0;outline:0;color:#eee;font-size:15px;padding:0 8px}.round{width:45px;height:45px;border:0;border-radius:50%;background:transparent;color:#aaa;display:grid;place-items:center;font-size:20px}.go{background:#e9e9eb;color:#111}
nav{position:fixed;z-index:6;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;background:#101012;border-top:1px solid #1d1d21;display:flex;justify-content:space-around}nav button{border:0;background:none;color:#606067;width:20%;font-size:9px;padding-top:10px}nav button.active{color:#eee}nav i{font-style:normal;display:block;font-size:20px;height:26px}
h2{font-size:29px;letter-spacing:-.6px;margin:30px 0 5px}.sub{font-size:13px;color:#85858d;line-height:20px}.section{font-size:9px;letter-spacing:1.6px;color:#68686f;font-weight:700;margin:28px 0 10px}
.timeline{margin-top:25px}.date{font-size:10px;letter-spacing:1.3px;color:#777;font-weight:700;margin-bottom:9px}.event{display:flex;gap:14px;padding:14px 12px;margin-bottom:8px;background:#141417;border:1px solid #232328;border-radius:13px}.eventtime{font-size:11px;color:#777;width:40px}.event b{font-size:13px;font-weight:500}.event span{display:block;font-size:11px;color:#707078;margin-top:3px}
.mission{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid #1f1f23}.ico{width:42px;height:42px;background:#151518;border:1px solid #24242a;border-radius:12px;display:grid;place-items:center;color:#bbb}.mission h3{font-size:14px;margin:0 0 3px;font-weight:500}.mission p{font-size:11px;color:#707078;margin:0;line-height:17px}.pill{font-size:9px;color:#999;letter-spacing:1px;text-transform:uppercase;margin-top:7px}
.review{margin-top:22px;background:#141417;border:1px solid #2a2a30;border-radius:17px;padding:17px}.review .top{display:flex;justify-content:space-between}.review h3{font-size:19px;margin:8px 0 6px}.review p{font-size:13px;color:#92929a;line-height:20px}.reason{padding:12px;background:#101013;border-radius:11px;color:#aaa;font-size:12px;line-height:18px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{height:44px;flex:1;border-radius:11px;border:1px solid #37373d;background:none;color:#ddd;font-size:12px}.actions .primary{background:#e8e8ea;color:#111;border:0}
.setting{padding:17px 0;border-bottom:1px solid #202024;display:flex;justify-content:space-between}.setting b{font-size:14px;font-weight:500}.setting span{display:block;color:#707078;font-size:11px;margin-top:4px}.toggle{width:38px;height:22px;border-radius:12px;background:#777;position:relative}.toggle:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#eee;right:2px;top:2px}
.toast{position:fixed;z-index:10;top:105px;left:50%;transform:translateX(-50%);background:#e8e8ea;color:#111;border-radius:20px;padding:10px 14px;font-size:12px;display:none;box-shadow:0 8px 30px #0008}
</style></head><body><div class="app" id="app"></div><div class="toast" id="toast"></div>
<script>
let tab='Assistant', messages=[['ai','Bonjour. Je suis Secretary. Dites-moi ce que vous voulez déléguer, comme si vous parliez à votre secrétaire.']],missions=[
['Cadeau anniversaire de mon frère','20 septembre · budget 80 €','Recherche en cours','♢'],
['Restaurant vendredi soir','18 septembre · 2 personnes','À valider','♨'],
['Suivi dentiste enfant','Aujourd’hui · rendez-vous terminé','À traiter','＋']];
const navs=[['✦','Assistant'],['□','Agenda'],['☷','Missions'],['✓','À valider'],['○','Profil']];
function ask(x){if(!x.trim())return;messages.push(['me',x],['ai','Compris. Je prends la demande en charge. Je vais croiser votre agenda, vos préférences et les contraintes, puis avancer sans vous solliciter inutilement.']);missions.unshift([x,'Nouvelle mission · analyse en cours','En cours','✦']);render();setTimeout(()=>toast('Mission créée — Secretary travaille dessus'),250)}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function render(){document.getElementById('app').innerHTML=`<header><div><div class="logo">SECRETARY</div><div class="tag">${tab==='Assistant'?'Votre temps, libéré.':tab}</div></div><div class="avatar">S</div></header>${content()}${tab==='Assistant'?composer():''}<nav>${navs.map(n=>`<button class="${tab===n[1]?'active':''}" onclick="tab='${n[1]}';render()"><i>${n[0]}</i>${n[1]}</button>`).join('')}</nav>`}
function composer(){return `<div class="composer"><button class="round" onclick="toast('Mode vocal — à connecter dans la version production')">●</button><input id="input" placeholder="Que puis-je gérer pour vous ?" onkeydown="if(event.key==='Enter'){ask(this.value)}"><button class="round go" onclick="ask(document.getElementById('input').value)">↑</button></div>`}
function content(){
if(tab==='Assistant')return `<main><section class="hero"><div class="ey">SECRÉTAIRE PERSONNELLE IA</div><h1>Qu’est-ce que je peux vous enlever de la tête ?</h1><div class="desc">Vous donnez l’intention. Secretary s’occupe du reste, apprend vos habitudes et revient vers vous uniquement quand votre décision est nécessaire.</div></section><div class="quick"><button class="chip" onclick="ask('Trouve-moi un restaurant pour vendredi')">Restaurant</button><button class="chip" onclick="ask('Organise mon prochain rendez-vous')">Rendez-vous</button><button class="chip" onclick="ask('Trouve un cadeau')">Cadeau</button><button class="chip" onclick="ask('Planifie mes courses')">Courses</button></div><div class="chat">${messages.map(m=>`<div class="msg ${m[0]==='me'?'me':'ai'}">${m[0]==='ai'?'<small>SECRETARY</small>':''}${m[1]}</div>`).join('')}</div></main>`;
if(tab==='Agenda')return `<main><h2>Agenda</h2><div class="sub">Une seule vision de vos calendriers et des missions Secretary.</div><div class="timeline">${['LUN 14','MAR 15','MER 16','JEU 17','VEN 18'].map((d,i)=>`<div class="date">${d}</div>${i===2?`<div class="event"><div class="eventtime">15:00</div><div><b>Dentiste · Enfant</b><span>Familial</span></div></div>`:i===4?`<div class="event"><div class="eventtime">20:00</div><div><b>Restaurant · proposé par Secretary</b><span>2 personnes · en attente de validation</span></div></div>`:`<div style="height:18px"></div>`).join('')}</div><div class="card">↻ &nbsp; Google Calendar · synchronisation simulée</div></main>`;
if(tab==='Missions')return `<main><h2>Missions</h2><div class="sub">Secretary travaille pendant que vous faites autre chose.</div>${missions.map(m=>`<div class="mission"><div class="ico">${m[3]}</div><div><h3>${m[0]}</h3><p>${m[1]}</p><div class="pill">${m[2]}</div></div></div>`).join('')}</main>`;
if(tab==='À valider')return `<main><h2>À valider</h2><div class="sub">Seulement les décisions qui nécessitent votre accord.</div><div class="review"><div class="top"><div class="ey">RESTAURANT · VENDREDI 18</div><div>4,7 ★</div></div><h3>L’Atelier du Marché</h3><div class="sub">12 min · environ 45 € / personne · compatible avec votre budget</div><p>J’ai volontairement privilégié une cuisine différente de l’italien fait la semaine dernière.</p><div class="reason">Pourquoi je le recommande : très bien noté, nouveau pour vous et cohérent avec vos habitudes.</div><div class="actions"><button onclick="toast('Autres options affichées')">Voir les options</button><button class="primary" onclick="toast('Réservation à confirmer dans la version connectée')">Réserver</button></div></div><div class="review"><div class="ey">CADEAU · 20 SEPTEMBRE</div><h3>3 idées sélectionnées</h3><div class="sub">Budget 80 € · goûts connus · retrait avant dimanche</div><div class="actions"><button class="primary" onclick="toast('Sélection ouverte')">Consulter</button></div></div></main>`;
return `<main><h2>Profil</h2><div class="sub">Secretary s’adapte à votre façon de vivre.</div><div class="section">CONNEXIONS</div><div class="setting"><div><b>Agendas</b><span>Google · Apple · travail · familial</span></div><div>›</div></div><div class="setting"><div><b>Préférences</b><span>Goûts, budgets, habitudes apprises</span></div><div>›</div></div><div class="section">AUTONOMIE</div><div class="setting"><div><b>Validation des achats</b><span>Toujours demander mon accord</span></div><div class="toggle"></div></div><div class="setting"><div><b>Notifications</b><span>Uniquement les décisions importantes</span></div><div class="toggle"></div></div><div class="section">CONFIDENTIALITÉ</div><div class="setting"><div><b>Mémoire</b><span>Contrôler ce que Secretary apprend</span></div><div>›</div></div></main>`;
}
render();
</script></body></html>
